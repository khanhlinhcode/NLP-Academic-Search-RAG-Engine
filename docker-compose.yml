services:
  ollama:
    image: ollama/ollama:0.33.2
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  model-init:
    image: ollama/ollama:0.33.2
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $${LLM_MODEL_NAME:-qwen2.5:7b}"]
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      ENVIRONMENT: production
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen2.5:7b}
      USE_RERANKER: ${USE_RERANKER:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501}
    volumes:
      - ./data:/app/data:ro
      - model_cache:/home/app/.cache:rw
    ports:
      - "8000:8000"
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 8G

  ui:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    command: ["streamlit", "run", "scripts/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  ollama_data:
  model_cache:
