# ──────────────────────────────────────────────────────────────────
# NLP Academic Search & RAG Engine — Docker Compose
# ──────────────────────────────────────────────────────────────────

services:
  # FastAPI Search & RAG API
  api:
    build: .
    container_name: nlp-search-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL_NAME=qwen2.5:7b
      - USE_RERANKER=true
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

  # Ollama LLM Server
  ollama:
    image: ollama/ollama:latest
    container_name: nlp-search-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
