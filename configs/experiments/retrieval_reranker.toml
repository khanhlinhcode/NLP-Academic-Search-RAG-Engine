[experiment]
name = "retrieval_reranker"
dataset = "scifact"
split = "test"
retrieval_method = "hybrid_reranked"
bm25_weight = 0.4
semantic_weight = 0.6
reranker_model = "cross-encoder/ms-marco-MiniLM-L-6-v2"
rrf_k = 60
candidate_pool = 50
top_k = 10
random_seed = 42
timeout_seconds = 30.0
concurrency = 2
output_dir = "reports/experiments/retrieval_reranker"
